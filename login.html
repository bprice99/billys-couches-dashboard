<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Billy's HQ"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#2b1d16"><link rel="icon" type="image/png" href="/favicon.png"><link rel="apple-touch-icon" href="/icon-180.png"><link rel="manifest" href="/manifest.json">
<title>Billy's HQ</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#2b1d16;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  form{background:#fff;border-radius:20px;padding:36px 30px;width:100%;max-width:360px;margin:16px;text-align:center}
  h1{font-size:22px;margin:0 0 4px;color:#2b1d16}
  p{font-size:14px;color:#7a6f66;margin:0 0 22px}
  input{width:100%;padding:14px 16px;border:1px solid #d9d0c5;border-radius:12px;font-size:16px;margin-bottom:12px}
  button{width:100%;padding:14px;border:0;border-radius:12px;background:#b0524c;color:#fff;font-size:16px;font-weight:700;cursor:pointer}
  .bad{color:#b0524c;font-size:14px;font-weight:600;margin:-4px 0 12px;display:none}
</style></head>
<body>
<form method="post" action="/login">
  <h1>Billy's Couches</h1>
  <p>Dashboard</p>
  <input type="hidden" name="next" id="next">
  <input type="password" name="password" placeholder="Password" autofocus required>
  <input type="text" name="code" id="code" placeholder="6-digit code from your app" inputmode="numeric" autocomplete="one-time-code" maxlength="6" style="display:none">
  <div class="bad" id="bad">Wrong password. Try again.</div>
  <button type="submit">Log in</button>
</form>
<script>
document.getElementById('next').value=location.pathname+location.search.replace(/[?&]bad=\w+/,'');
var q=location.search, b=document.getElementById('bad');
if(/bad=1/.test(q)){b.style.display='block'}
if(/bad=code/.test(q)){b.textContent='Wrong code. Use the newest code in your app.';b.style.display='block'}
if(/bad=locked/.test(q)){b.textContent='Too many tries. Wait 15 minutes and try again.';b.style.display='block'}
fetch('/login-info').then(function(r){return r.json()}).then(function(j){if(j.twofa){var c=document.getElementById('code');c.style.display='block';c.required=true}}).catch(function(){});
</script>
</body></html>

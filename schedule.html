<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2b1d16"><meta name="robots" content="noindex">
<title>Schedule · Billy's Couches</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
:root{--red:#b0524c;--red2:#963f3a;--dark:#2b1d16;--cream:#f7f3ee;--line:#e8e0d6;--muted:#7a6f66;--green:#2e7d4f}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:Inter,-apple-system,Segoe UI,Arial,sans-serif;background:var(--cream);color:var(--dark);-webkit-font-smoothing:antialiased}
.wrap{max-width:480px;margin:0 auto;min-height:100vh;background:var(--cream)}
.top{background:var(--dark);color:#fff;padding:16px 20px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
.logo{background:#fff;color:var(--dark);font-family:'DM Serif Display',serif;font-size:15px;padding:3px 11px;border-radius:99px;border:2px solid var(--red);text-decoration:none}
.top small{font-size:12.5px;opacity:.75;margin-left:auto}
.steps{display:flex;gap:6px;padding:14px 20px 0}.steps i{flex:1;height:4px;border-radius:9px;background:var(--line);transition:background .2s}.steps i.on{background:var(--red)}
.pad{padding:16px 20px 40px}
.h{font-size:24px;font-weight:900;letter-spacing:-.02em;margin:6px 0 4px;line-height:1.15}.p{font-size:14px;color:var(--muted);margin:0 0 16px;line-height:1.5}
.ord{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:16px}
.ord img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#efe9e2}
.ord .b{padding:12px 14px}.ord b{display:block;font-size:15.5px;line-height:1.3}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chip{font-size:12px;font-weight:700;background:#f3ece4;border-radius:99px;padding:4px 10px}.chip.g{background:#e3f1e8;color:var(--green)}
.lbl{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.days::-webkit-scrollbar{display:none}
.day{flex:0 0 62px;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:9px 0;text-align:center;cursor:pointer;font:inherit;color:inherit}
.day small{display:block;font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase}.day b{font-size:20px}.day.on{border-color:var(--red);background:#fbf0ee}.day.full{opacity:.4}
.slots{display:grid;gap:8px}
.slot{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:15px;cursor:pointer;font-family:inherit;color:inherit;text-align:left;width:100%}
.slot span{font-size:12.5px;color:var(--muted);font-weight:600}.slot.on{border-color:var(--red);background:#fbf0ee}.slot:disabled{opacity:.4;text-decoration:line-through;cursor:default}
.btn{display:block;width:100%;border:0;background:var(--red);color:#fff;text-align:center;font-weight:800;border-radius:14px;padding:16px;font-size:16px;margin-top:18px;cursor:pointer;font-family:inherit;text-decoration:none}
.btn:disabled{opacity:.45;cursor:default}.btn:active{transform:scale(.99)}
.ghost{display:block;width:100%;border:1.5px solid var(--line);background:#fff;color:var(--dark);text-align:center;font-weight:700;border-radius:14px;padding:14px;font-size:15px;margin-top:10px;cursor:pointer;font-family:inherit;text-decoration:none}
.back{background:none;border:0;color:var(--muted);font:inherit;font-size:14px;font-weight:600;padding:0;margin-bottom:6px;cursor:pointer}
.f{margin-bottom:12px}.f label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}
.f input,.f textarea{width:100%;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:13px;font:inherit;font-size:16px;color:var(--dark);outline:none}
.f input:focus,.f textarea:focus{border-color:var(--red)}.f textarea{min-height:70px;resize:vertical}
.row2{display:flex;gap:8px}.row2 .f:first-child{flex:2}.row2 .f:last-child{flex:1}
.up{background:#fff;border:2px solid var(--red);border-radius:16px;padding:14px 12px 6px;margin-top:6px}
.uph{font-weight:900;font-size:15.5px;margin:0 2px 10px;color:var(--red)}
.ui{display:flex;align-items:center;gap:11px;border:1.5px solid var(--line);border-radius:12px;padding:11px;margin-bottom:8px;cursor:pointer;user-select:none}
.ui.on{border-color:var(--green);background:#eef7f1}
.ui b{display:block;font-size:14.5px}.ui small{color:var(--muted);font-size:12.5px;line-height:1.35;display:block}.ui em{margin-left:auto;font-style:normal;font-weight:800;font-size:15px;white-space:nowrap}
.bx{width:24px;height:24px;border-radius:7px;border:2px solid #cfc4b8;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:14px}.ui.on .bx{background:var(--green);border-color:var(--green)}
.up p{font-size:12.5px;color:var(--muted);margin:2px 2px 8px}
.done{text-align:center;padding-top:6px}.ck{width:66px;height:66px;border-radius:50%;background:#e3f1e8;color:var(--green);font-size:34px;font-weight:900;display:flex;align-items:center;justify-content:center;margin:8px auto 10px}
.mini{display:flex;gap:11px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px;margin:14px 0 12px;text-align:left}
.mini img{width:78px;height:52px;object-fit:cover;border-radius:8px;background:#efe9e2;flex:none}.mini b{font-size:14px;display:block}.mini small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.sum{background:#fff;border:1px solid var(--line);border-radius:16px;padding:4px 14px;text-align:left}
.sum div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}.sum div:last-child{border:0}.sum span{color:var(--muted);flex:none}.sum b{text-align:right}
.err{background:#fdecea;color:#b91c1c;border-radius:12px;padding:12px 14px;font-size:14px;margin-top:12px;display:none}.err.show{display:block}
.note{background:#fff7ed;color:#9a3412;border-radius:12px;padding:12px 14px;font-size:14px;margin:12px 0;text-align:left}
.empty{color:var(--muted);font-size:14px;padding:10px 0}
.foot{font-size:12.5px;color:var(--muted);text-align:center;margin-top:18px}.foot a{color:var(--red);font-weight:600;text-decoration:none}
.load{padding:80px 20px;text-align:center;color:var(--muted)}
</style></head>
<body><div class="wrap">
  <div class="top"><a class="logo" href="https://billyscouches.com">Billy's Couches</a><small id="topLbl">Schedule</small></div>
  <div class="steps"><i id="s1" class="on"></i><i id="s2"></i><i id="s3"></i></div>
  <div id="app"><div class="load">Loading your order…</div></div>
</div>
<script>
const TOKEN = location.pathname.split('/').filter(Boolean).pop();
const PAID_BACK = new URLSearchParams(location.search).get('paid') === '1';
let D = null, ST = { date: '', win: '', extras: new Set(), step: 1, reschedule: false };
const $ = id => document.getElementById(id);
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const money = n => '$' + Number(n).toFixed(2);
const cap = s => String(s || '').replace(/\b\w/g, c => c.toUpperCase());
const isDel = () => D.type === 'delivery';
const fmtTel = v => { const d = String(v).replace(/\D/g, '').replace(/^1/, '').slice(0, 10); return d.length > 6 ? `(${d.slice(0, 3)}) ${d.slice(3, 6)}-${d.slice(6)}` : d.length > 3 ? `(${d.slice(0, 3)}) ${d.slice(3)}` : d; };
function steps(n){ ['s1', 's2', 's3'].forEach((id, i) => $(id).classList.toggle('on', i < n)); window.scrollTo(0, 0); }
function couchCard(){
  const c = D.couches[0] || {}, more = D.couches.length > 1 ? ` + ${D.couches.length - 1} more` : '';
  return `<div class="ord">${c.photo ? `<img src="${esc(c.photo)}" alt="">` : ''}<div class="b"><b>${esc(D.couches.map(x => x.title).join(' + ') || 'Your couch')}</b>
    <div class="chips"><span class="chip g">✓ Paid</span>${D.addons.map(a => `<span class="chip">+ ${esc(a)}</span>`).join('')}${isDel() ? '<span class="chip">White-glove delivery</span>' : '<span class="chip">Pick up at our warehouse</span>'}</div></div></div>`;
}
async function load(){
  try {
    const r = await fetch('/public/sched/' + encodeURIComponent(TOKEN), { cache: 'no-store' }), j = await r.json();
    if (!r.ok || !j.ok) throw new Error(j.error || 'Could not load your order.');
    D = j; $('topLbl').textContent = isDel() ? 'Schedule delivery' : 'Schedule pick up';
    if (D.booking && !ST.reschedule) return confirmed();
    step1();
  } catch (e) { $('app').innerHTML = `<div class="pad"><div class="h">Hmm, that didn't load</div><p class="p">${esc(e.message)}</p><a class="btn" href="sms:+13148997503">Text us</a></div>`; }
}
function step1(){
  steps(1); ST.step = 1;
  const days = D.days.filter(d => d.slots.length);
  if (!ST.date || !days.find(d => d.date === ST.date && d.slots.some(s => s.left > 0))) { const f = days.find(d => d.slots.some(s => s.left > 0)); ST.date = f ? f.date : ''; ST.win = ''; }
  const day = days.find(d => d.date === ST.date);
  $('app').innerHTML = `<div class="pad">
    ${ST.reschedule ? '<button class="back" onclick="ST.reschedule=false;confirmed()">← Keep my current time</button>' : ''}
    <div class="h">Hi ${esc(cap(D.first))}! Pick your ${isDel() ? 'delivery' : 'pick up'} time</div>
    <p class="p">${ST.reschedule ? 'Choose a new time. Your old one is released once you confirm.' : `Your couch is paid for and set aside. Choose when ${isDel() ? 'we bring it' : 'you grab it'}.`}</p>
    ${couchCard()}
    ${days.length ? `<div class="lbl">Day</div><div class="days">${days.map(d => { const full = !d.slots.some(s => s.left > 0);
        return `<button class="day ${d.date === ST.date ? 'on' : ''} ${full ? 'full' : ''}" ${full ? 'disabled' : ''} onclick="ST.date='${d.date}';ST.win='';step1()"><small>${d.dow}</small><b>${d.day}</b></button>`; }).join('')}</div>
      <div class="lbl">Time window${day ? ' · ' + esc(day.label) : ''}</div>
      <div class="slots">${day ? day.slots.map(s => `<button class="slot ${s.win === ST.win ? 'on' : ''}" ${s.left < 1 ? 'disabled' : ''} onclick="ST.win='${s.win}';step1()">${esc(s.label)} <span>${s.left < 1 ? 'Booked' : s.left === 1 ? '1 spot left' : 'Open'}</span></button>`).join('') : ''}</div>`
      : '<p class="empty">No open times right now. Text us at (314) 899-7503 and we\'ll fit you in.</p>'}
    <button class="btn" ${ST.win ? '' : 'disabled'} onclick="step2()">Continue →</button>
    <p class="foot">Questions? Text Billy at <a href="sms:+13148997503">(314) 899-7503</a></p></div>`;
}
function dueFor(){
  const sub = D.upsells.filter(a => ST.extras.has(a.id)).reduce((s, a) => s + a.price, 0);
  return Math.round(sub * (1 + D.taxRate / 100) * (1 + D.feeRate) * 100) / 100;
}
function step2(){
  steps(2); ST.step = 2;
  const day = D.days.find(d => d.date === ST.date), slot = day && day.slots.find(s => s.win === ST.win), b = D.booking || {};
  const v = (k, dflt) => esc(ST[k] ?? b[k] ?? dflt ?? '');
  $('app').innerHTML = `<div class="pad"><button class="back" onclick="saveFields();step1()">← Change time</button>
    <div class="h">${isDel() ? 'Where are we delivering?' : 'Almost done'}</div>
    <p class="p">${esc(day ? day.label : '')} · ${esc(slot ? slot.label : '')}</p>
    ${isDel() ? `<div class="f"><label>Street address</label><input id="fAddr" autocomplete="street-address" value="${v('address')}" placeholder="123 Main St, Apt 2"></div>
      <div class="row2"><div class="f"><label>City</label><input id="fCity" autocomplete="address-level2" value="${v('city')}" placeholder="St. Louis"></div>
      <div class="f"><label>ZIP</label><input id="fZip" inputmode="numeric" maxlength="5" autocomplete="postal-code" value="${v('zip', D.zip)}" placeholder="63069"></div></div>
      <div class="f"><label>Which room should it go in?</label><input id="fRoom" value="${v('room')}" placeholder="e.g. Living room, 2nd floor"></div>
      <div class="f"><label>Gate code / parking / anything we should know</label><textarea id="fNotes" placeholder="e.g. Park in back, ring the bell">${v('notes')}</textarea></div>`
    : `<div class="f"><label>Anything we should know?</label><textarea id="fNotes" placeholder="e.g. Bringing a pickup truck">${v('notes')}</textarea></div>`}
    <div class="f"><label>Best phone ${isDel() ? 'for the driver' : 'to reach you'}</label><input id="fPhone" type="tel" inputmode="tel" autocomplete="tel-national" maxlength="14" placeholder="(314) 555-0123" oninput="this.value=fmtTel(this.value)" value="${v('phone', D.phone ? `(${D.phone.slice(0, 3)}) ${D.phone.slice(3, 6)}-${D.phone.slice(6)}` : '')}"></div>
    ${D.upsells.length ? `<div class="up"><div class="uph">✨ Add before ${isDel() ? 'delivery' : 'pick up'} day</div>
      ${D.upsells.map(a => `<div class="ui ${ST.extras.has(a.id) ? 'on' : ''}" onclick="tog('${a.id}')"><span class="bx">${ST.extras.has(a.id) ? '✓' : ''}</span><div><b>${esc(a.label)}</b><small>${esc(a.pitch)}</small></div><em>+$${a.price}</em></div>`).join('')}
      ${D.addons.length ? `<p>${esc(D.addons.join(' and '))} ${D.addons.length > 1 ? 'are' : 'is'} already on your order ✓</p>` : '<p>Optional. Paid by card once you confirm.</p>'}</div>` : ''}
    <div class="err" id="err"></div>
    <button class="btn" id="go" onclick="submit()">${btnText()}</button>
    <p class="foot">Questions? Text Billy at <a href="sms:+13148997503">(314) 899-7503</a></p></div>`;
}
const btnText = () => { const due = dueFor(); return `Confirm ${isDel() ? 'delivery' : 'pick up'}${due ? ' · Pay ' + money(due) : ''}`; };
function saveFields(){ [['address', 'fAddr'], ['city', 'fCity'], ['zip', 'fZip'], ['room', 'fRoom'], ['notes', 'fNotes'], ['phone', 'fPhone']].forEach(([k, id]) => { if ($(id)) ST[k] = $(id).value; }); }
function tog(id){ saveFields(); ST.extras.has(id) ? ST.extras.delete(id) : ST.extras.add(id); step2(); }
async function submit(){
  saveFields(); const err = $('err'); err.classList.remove('show');
  if (isDel()) {
    if (!(ST.address || '').trim() || !(ST.city || '').trim()) { err.textContent = 'Add your street address and city.'; return err.classList.add('show'); }
    if (!/^\d{5}$/.test((ST.zip || '').trim())) { err.textContent = 'Add your 5-digit ZIP code.'; return err.classList.add('show'); }
  }
  if ((ST.phone || '').replace(/\D/g, '').length !== 10) { err.textContent = 'Enter a 10-digit phone number.'; return err.classList.add('show'); }
  const go = $('go'); go.disabled = true; go.textContent = 'Booking…';
  try {
    const r = await fetch('/public/sched/' + encodeURIComponent(TOKEN), { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ date: ST.date, win: ST.win, address: ST.address, city: ST.city, zip: ST.zip, room: ST.room, notes: ST.notes, phone: ST.phone, extras: [...ST.extras] }) });
    const j = await r.json();
    if (r.status === 409) { D.days = j.days || D.days; ST.win = ''; alertBack(j.error); return; }
    if (!r.ok || !j.ok) throw new Error(j.error || 'Could not book. Please try again.');
    D = { ...D, ...j, days: D.days }; ST.reschedule = false; ST.extras = new Set();
    if (j.payUrl) { go.textContent = 'Opening secure payment…'; location.href = j.payUrl; return; }
    confirmed(j.due && !j.payUrl);
  } catch (e) { err.textContent = e.message; err.classList.add('show'); go.disabled = false; go.textContent = btnText(); }
}
function alertBack(msg){ step1(); const p = document.querySelector('.pad .p'); if (p) p.insertAdjacentHTML('afterend', `<div class="note">${esc(msg)}</div>`); }
function icsHref(){
  const w = (D.booking.win || '').match(/^(\d{1,2})(?::(\d\d))?-(\d{1,2})(?::(\d\d))?$/); if (!w) return '';
  const s = (+w[1]) * 60 + (+w[2] || 0), e = (+w[3]) * 60 + (+w[4] || 0), hh = m => String(Math.floor(m / 60)).padStart(2, '0') + String(m % 60).padStart(2, '0');
  return `https://order.billyscouches.com/api/cal?start=${D.booking.date.replace(/-/g, '')}T${hh(s)}&mins=${e - s}`;
}
function confirmed(payFailed){
  steps(3); ST.step = 3; const b = D.booking, c = D.couches[0] || {}, adds = [...D.addons, ...(b.extras || [])];
  $('app').innerHTML = `<div class="pad done"><div class="ck">✓</div>
    <div class="h">You're all set, ${esc(cap(D.first))}!</div>
    <p class="p">${isDel() ? "We'll text you the morning of, and again when the truck is on the way." : "See you then! We'll have it ready at the warehouse."}</p>
    ${PAID_BACK ? '<div class="note" style="background:#e3f1e8;color:#2e7d4f">Payment received. Your add-ons are on the order ✓</div>' : ''}
    ${payFailed ? '<div class="note">We saved your add-ons. Billy will text you a payment link.</div>' : ''}
    <div class="mini">${c.photo ? `<img src="${esc(c.photo)}" alt="">` : ''}<div><b>${esc(D.couches.map(x => x.title).join(' + '))}</b><small>${adds.length ? esc(adds.join(' · ')) : (isDel() ? 'White-glove delivery' : 'Pick up')}</small></div></div>
    <div class="sum"><div><span>When</span><b>${esc(b.label)}</b></div>
      ${isDel() ? `<div><span>Where</span><b>${esc(b.address)}${b.city ? ', ' + esc(b.city) : ''}</b></div>${b.room ? `<div><span>Room</span><b>${esc(b.room)}</b></div>` : ''}` : '<div><span>Where</span><b>126 E Orleans St, Pacific</b></div>'}
      <div><span>Need to change it?</span><b><a href="#" style="color:var(--red);text-decoration:none" onclick="event.preventDefault();ST.reschedule=true;ST.date=D.booking.date;ST.win='';load()">Reschedule</a></b></div></div>
    ${icsHref() ? `<a class="ghost" href="${icsHref()}">＋ Add to my calendar</a>` : ''}
    <p class="foot">Questions? Text Billy at <a href="sms:+13148997503">(314) 899-7503</a></p></div>`;
}
load();
</script>
</body></html>

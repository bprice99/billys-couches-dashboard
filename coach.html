<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f2a33"><link rel="icon" type="image/png" href="/favicon.png">
<title>Coaching HQ</title>
<script src="/chart.js"></script>
<style>
:root{--red:#b0524c;--red2:#963f3a;--dark:#1f2a33;--cream:#efe9e2;--bg:#f6f4f1;--line:#e6e0d8;--muted:#776d65;--text:#222;--green:#2e7d4f;--blue:#2f5d8a;--gold:#b7791f;--bad:#c0392b}
*{box-sizing:border-box}html,body{margin:0}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:15px}
.app{display:flex;min-height:100vh}
nav.side{width:220px;flex:none;background:var(--dark);color:#fff;padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.brand b{display:block;font-size:17px}.brand span{font-size:12px;opacity:.65}.brand{padding:0 10px 18px}
.nav{display:block;padding:11px 12px;border-radius:10px;color:#e8e2dc;text-decoration:none;cursor:pointer;font-size:14.5px;margin-bottom:2px}.nav:hover{background:rgba(255,255,255,.07)}.nav.on{background:var(--red);color:#fff;font-weight:700}
.side .foot{margin-top:auto;padding:10px;font-size:13px}.side .foot a{color:#e8e2dc}
main{flex:1;min-width:0;padding:26px 30px 60px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}.top h1{margin:0;font-size:26px;flex:1}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 13px;font-size:14px;font-weight:600;cursor:pointer;color:var(--text);text-decoration:none;display:inline-block}
.btn.p{background:var(--red);border-color:var(--red);color:#fff}.btn.p:hover{background:var(--red2)}.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}.btn.x{color:var(--bad)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px}.kpi small{color:var(--muted);font-size:12.5px}.kpi b{display:block;font-size:24px;margin-top:4px}.kpi i{font-style:normal;font-size:12px;color:var(--muted)}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:16px}.card h2{font-size:15px;margin:0 0 12px;display:flex;align-items:center;gap:8px}.card h2 .sp{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.grid2>.card{margin-bottom:0}
.empty{color:var(--muted);font-size:14px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}th{font-size:12px;color:var(--muted);font-weight:600}td.n,th.n{text-align:right}
.ccard{display:flex;gap:14px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;cursor:pointer;margin-bottom:10px}.ccard:hover{border-color:var(--red)}
.av{flex:none;width:44px;height:44px;border-radius:50%;background:var(--dark);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.ccard .m{flex:1;min-width:0}.ccard .m b{display:block}.ccard .m small{color:var(--muted)}
.bar{height:7px;background:#eee7df;border-radius:99px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--red);border-radius:99px}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:#eee;color:#555}.pill.g{background:#dff2e5;color:#1f6b3d}.pill.r{background:#fbe4e0;color:var(--red2)}.pill.y{background:#fff3d6;color:#8a5a00}.pill.b{background:#e3ecf6;color:var(--blue)}
.f{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:10px}.f input,.f select,.f textarea{display:block;width:100%;margin-top:4px;padding:9px 11px;border:1px solid #dcd4ca;border-radius:9px;font:inherit;font-size:14.5px;color:var(--text);background:#fff}
.f textarea{resize:vertical}.two{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 10px}
.row{display:flex;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}.row:first-child{border-top:0}.row input[type=text],.row input[type=date],.row input[type=url],.row input[type=number]{padding:7px 9px;border:1px solid #dcd4ca;border-radius:8px;font:inherit;font-size:14px;min-width:0}
.row .grow{flex:1}.chk{width:20px;height:20px;flex:none;accent-color:var(--red)}
.done{text-decoration:line-through;color:var(--muted)}
.save{font-size:12.5px;color:var(--muted)}
.chartwrap{position:relative;height:240px}
.cols{display:grid;grid-template-columns:repeat(5,minmax(200px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:#efebe6;border-radius:14px;padding:10px;min-height:120px}.col h3{font-size:13px;margin:2px 4px 10px;display:flex;justify-content:space-between}
.vc{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer;font-size:14px}.vc small{display:block;color:var(--muted);margin-top:3px;font-size:12px}.vc:hover{border-color:var(--red)}
.ytwrap{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:16px;align-items:start}.ytwrap .bank{margin:0;min-height:200px}
.calbar{display:flex;align-items:center;gap:10px;margin-bottom:10px}.calbar h2{margin:0;font-size:18px;flex:1;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.dow{font-size:12px;font-weight:700;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);background:#faf8f5}
.cal .d{min-height:104px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px 7px;font-size:12px;cursor:pointer}.cal .d:nth-child(7n){border-right:0}.cal .d:hover{background:#fcfaf8}
.cal .d .n{font-weight:700;color:#555;margin-bottom:4px}.cal .d.o .n{color:#c9c2ba}.cal .d.t{background:#fff7f5}.cal .d.t .n{color:var(--red)}
.ev{border-radius:7px;padding:4px 6px;margin-bottom:4px;font-size:11.5px;line-height:1.25;color:#fff;font-weight:600;cursor:grab}.ev small{display:block;font-weight:400;opacity:.85}
.ev.sched{background:var(--red)}.ev.posted{background:var(--green)}.ev.late{background:#b7791f}
.agenda{display:none}.bank .vc{cursor:grab}
@media(max-width:900px){.ytwrap{grid-template-columns:1fr}.cal{display:none}.agenda{display:block}}
.mask{position:fixed;inset:0;background:rgba(15,20,25,.5);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}.mask.on{display:flex}
.modal{background:#fff;border-radius:18px;padding:22px;width:100%;max-width:560px;max-height:92vh;overflow:auto;position:relative}.modal h3{margin:0 40px 14px 0}
.xb{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:20px;cursor:pointer}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}.acts .sp{flex:1}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;display:none;z-index:99}
.portal{background:#f3efe9;border:1px dashed #d8cfc4;border-radius:14px;padding:12px 14px;margin-bottom:16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.portal .f{margin:0;min-width:120px}
.ci td{vertical-align:top}.ci small{color:var(--muted)}
@media(max-width:900px){.app{display:block}nav.side{position:sticky;z-index:10;width:auto;height:auto;flex-direction:row;align-items:center;overflow-x:auto;padding:10px;gap:4px;top:0}
  .brand{display:none}.nav{white-space:nowrap;margin:0}.side .foot{margin:0 0 0 auto;white-space:nowrap}main{padding:18px 14px 60px}
  .grid2,.two,.three{grid-template-columns:1fr}.cols{grid-template-columns:repeat(5,82%)}.kpis{grid-template-columns:1fr 1fr}
  .f input,.f select,.f textarea,.row input{font-size:16px!important}}
</style></head>
<body>
<div class="app">
  <nav class="side">
    <div class="brand"><b>Billy Price Coaching</b><span>Coaching HQ</span></div>
    <a class="nav" data-tab="home">Home</a>
    <a class="nav" data-tab="clients">Clients</a>
    <a class="nav" data-tab="youtube">YouTube</a>
    <a class="nav" data-tab="pipeline">Pipeline</a>
    <div class="foot"><a href="/">&larr; Billy's Couches HQ</a></div>
  </nav>
  <main><div id="view"><p class="empty">Loading…</p></div></main>
</div>

<div class="mask" id="m-item"><div class="modal"><button class="xb" data-close>&times;</button><div id="itemBody"></div></div></div>
<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[<>&"]/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' }[c]));
const money = n => '$' + Math.round(Number(n) || 0).toLocaleString('en-US');
const num = v => Number(String(v ?? '').replace(/[^\d.\-]/g, '')) || 0;
const fmtD = s => { if (!s) return ''; const d = new Date(String(s).slice(0, 10) + 'T12:00:00'); return isNaN(d) ? s : d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }); };
const todayISO = () => new Date().toLocaleDateString('en-CA');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
function toast(t){ const el = $('toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => el.style.display = 'none', 2600); }
async function post(url, body){ const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }); if (r.status === 401) { location.reload(); return; } const j = await r.json(); if (!j.ok) throw new Error(j.error || 'Failed'); return j; }

let D = null, TAB = 'home', CUR = null, charts = {};
async function load(){
  const r = await fetch('/api/coach', { cache: 'no-store' }); if (r.status === 401) return location.reload();
  D = await r.json(); render();
}
function setTab(t, id){
  TAB = t; CUR = id || null;
  document.querySelectorAll('.nav').forEach(n => n.classList.toggle('on', n.dataset.tab === t));
  history.replaceState(null, '', '/coach' + (t !== 'home' ? '?tab=' + t + (id ? '&id=' + id : '') : ''));
  render(); window.scrollTo(0, 0);
}
function render(){
  if (!D) return;
  Object.values(charts).forEach(c => c.destroy()); charts = {};
  ({ home: renderHome, clients: CUR ? renderClient : renderClients, youtube: renderYouTube, pipeline: renderPipeline })[TAB]();
}

// ---------- helpers on clients ----------
const monthKey = (d = new Date()) => d.toLocaleDateString('en-CA').slice(0, 7);
function progressPct(c){ const s = Date.parse(c.program?.start), e = Date.parse(c.program?.end); if (!s || !e || e <= s) return 0; return Math.max(0, Math.min(1, (Date.now() - s) / (e - s))); }
function lastCheckin(c){ return (c.checkins || []).slice().sort((a, b) => b.week.localeCompare(a.week))[0]; }
function monthTotals(c, mk = monthKey()){ const t = { flips: 0, revenue: 0, profit: 0, weeks: 0 }; (c.checkins || []).filter(x => x.week.slice(0, 7) === mk).forEach(x => { t.flips += x.flips; t.revenue += x.revenue; t.profit += x.profit; t.weeks++; }); return t; }
const paidCount = c => (c.program?.payments || []).filter(p => p.paid).length;
const initials = n => String(n || '?').split(/\s+/).map(x => x[0]).join('').slice(0, 2).toUpperCase();
function daysSince(ts){ return ts ? Math.floor((Date.now() - ts) / 864e5) : null; }

// ---------- Home ----------
function renderHome(){
  const act = D.clients.filter(c => c.active !== false), mk = monthKey();
  const pays = act.flatMap(c => (c.program?.payments || []).map(p => ({ ...p, who: c.name })));
  const collected = D.clients.flatMap(c => c.program?.payments || []).filter(p => p.paid && String(p.paidAt || '').slice(0, 7) === mk).reduce((a, p) => a + num(p.amount), 0);
  const owed = pays.filter(p => !p.paid).reduce((a, p) => a + num(p.amount), 0);
  const leadsM = D.leads.filter(l => String(l.date || new Date(l.createdAt).toISOString()).slice(0, 7) === mk).length;
  const booked = D.leads.filter(l => l.stage === 'Call booked').length;
  const posted = D.videos.filter(v => (v.posted || v.status === 'Posted') && String(v.date || '').slice(0, 7) === mk).length;
  const quiet = act.filter(c => { const l = lastCheckin(c); return !l || daysSince(l.at) > 8; });
  const upcoming = act.flatMap(c => (c.calls || []).filter(x => x.date >= todayISO()).map(x => ({ ...x, who: c.name, cid: c.id }))).sort((a, b) => a.date.localeCompare(b.date)).slice(0, 6);
  const recent = act.flatMap(c => (c.checkins || []).map(x => ({ ...x, who: c.name, cid: c.id }))).sort((a, b) => b.at - a.at).slice(0, 8);
  $('view').innerHTML = `<div class="top"><h1>Coaching</h1><button class="btn p" data-newclient>+ New client</button></div>
  <div class="kpis">
    <div class="kpi"><small>Active clients</small><b>${act.length}</b></div>
    <div class="kpi"><small>Collected this month</small><b>${money(collected)}</b></div>
    <div class="kpi"><small>Still owed (payment plans)</small><b>${money(owed)}</b></div>
    <div class="kpi"><small>Leads this month</small><b>${leadsM}</b><i>${booked} calls booked</i></div>
    <div class="kpi"><small>Videos posted this month</small><b>${posted}</b></div>
  </div>
  <div class="grid2">
    <div class="card"><h2>Needs attention</h2>${quiet.length ? quiet.map(c => `<div class="row" style="cursor:pointer" data-open="${c.id}"><span class="grow"><b>${esc(c.name)}</b></span><span class="pill r">${lastCheckin(c) ? 'No check-in in ' + daysSince(lastCheckin(c).at) + ' days' : 'No check-ins yet'}</span></div>`).join('') : '<p class="empty">Everyone checked in this week.</p>'}
      ${act.filter(c => (c.program?.payments || []).some(p => !p.paid)).map(c => { const p = c.program.payments.find(x => !x.paid); return `<div class="row" style="cursor:pointer" data-open="${c.id}"><span class="grow">${esc(c.name)} &middot; next payment</span><span class="pill y">${esc(p.label)} ${money(p.amount)}</span></div>`; }).join('')}</div>
    <div class="card"><h2>Upcoming calls</h2>${upcoming.length ? upcoming.map(x => `<div class="row" style="cursor:pointer" data-open="${x.cid}"><span class="grow"><b>${esc(x.who)}</b> &middot; ${esc(x.title)}</span><span class="pill b">${fmtD(x.date)}</span></div>`).join('') : '<p class="empty">No upcoming calls on the books. Add the date to a client\'s Calls list.</p>'}</div>
  </div>
  <div class="card" style="margin-top:16px"><h2>Latest client check-ins</h2>${recent.length ? `<table class="ci"><tr><th>Client</th><th>Week of</th><th class="n">Flips</th><th class="n">Revenue</th><th class="n">Profit</th><th>Win / stuck on</th></tr>${recent.map(x => `<tr style="cursor:pointer" data-open="${x.cid}"><td><b>${esc(x.who)}</b></td><td>${fmtD(x.week)}</td><td class="n">${x.flips}</td><td class="n">${money(x.revenue)}</td><td class="n">${money(x.profit)}</td><td><small>${esc(x.win || '')}${x.stuck ? '<br>Stuck: ' + esc(x.stuck) : ''}</small></td></tr>`).join('')}</table>` : '<p class="empty">Check-ins show up here when clients log their week on their page.</p>'}</div>`;
}

// ---------- Clients list ----------
function renderClients(){
  const list = D.clients.slice().sort((a, b) => (b.active !== false) - (a.active !== false));
  $('view').innerHTML = `<div class="top"><h1>Clients</h1><button class="btn p" data-newclient>+ New client</button></div>` +
    (list.length ? list.map(c => { const pc = progressPct(c), mt = monthTotals(c), l = lastCheckin(c), pays = c.program?.payments || [];
      return `<div class="ccard" data-open="${c.id}"><div class="av">${esc(initials(c.name))}</div><div class="m"><b>${esc(c.name)} ${c.active === false ? '<span class="pill">Finished</span>' : ''}</b>
        <small>${esc(c.business || c.market || '')} &middot; ${esc(c.program?.length || '')} &middot; ${pays.length ? paidCount(c) + '/' + pays.length + ' paid' : ''} &middot; ${l ? 'last check-in ' + fmtD(l.week) : 'no check-ins yet'}</small>
        <div class="bar"><i style="width:${Math.round(pc * 100)}%"></i></div></div>
        <div style="text-align:right;min-width:110px"><b>${mt.flips}${c.goals?.flips ? ' / ' + c.goals.flips : ''}</b><br><small class="empty">flips this month</small></div></div>`; }).join('')
      : '<div class="card"><p class="empty">No clients yet.</p></div>');
}

// ---------- Client detail ----------
let saveT = null;
function curClient(){ return D.clients.find(c => c.id === CUR); }
function getPath(o, p){ return p.split('.').reduce((a, k) => a == null ? a : a[k], o); }
function setPath(o, p, v){ const ks = p.split('.'); let t = o; ks.slice(0, -1).forEach(k => { if (t[k] == null || typeof t[k] !== 'object') t[k] = {}; t = t[k]; }); t[ks[ks.length - 1]] = v; }
function queueSave(c){ $('saveSt') && ($('saveSt').textContent = 'Saving…'); clearTimeout(saveT); saveT = setTimeout(() => saveClient(c), 700); }
async function saveClient(c){
  try { await post('/api/coach/client/save', { client: c }); $('saveSt') && ($('saveSt').textContent = 'Saved'); }
  catch (e) { $('saveSt') && ($('saveSt').textContent = 'Not saved'); toast(e.message); }
}
const F = (label, path, type = 'text', extra = '') => { const c = curClient(), v = getPath(c, path) ?? '';
  return `<label class="f">${label}${type === 'textarea' ? `<textarea data-f="${path}" rows="3" ${extra}>${esc(v)}</textarea>` : `<input type="${type}" data-f="${path}" value="${esc(v)}" ${extra}>`}</label>`; };
function renderClient(){
  const c = curClient(); if (!c) { CUR = null; return renderClients(); }
  c.links = c.links || {}; c.program = c.program || {}; c.start = c.start || {}; c.goals = c.goals || {}; c.calls = c.calls || []; c.tasks = c.tasks || []; c.checkins = c.checkins || [];
  c.program.payments = c.program.payments || [];
  const portal = location.origin + '/client';
  const oneTime = c.tasks.filter(t => !t.recurring), months = [...new Set(oneTime.map(t => +t.month || 1))].sort((a, b) => a - b), rec = c.tasks.filter(t => t.recurring);
  const ck = c.checkins.slice().sort((a, b) => b.week.localeCompare(a.week)), mt = monthTotals(c);
  const taskRow = t => `<div class="row"><input type="checkbox" class="chk" data-task="${t.id}" ${(t.recurring ? t.doneWeek === D.week : t.done) ? 'checked' : ''}><span class="grow ${(t.recurring ? t.doneWeek === D.week : t.done) ? 'done' : ''}" contenteditable="true" data-tasktext="${t.id}">${esc(t.text)}</span><button class="btn sm x" data-deltask="${t.id}">&times;</button></div>`;
  $('view').innerHTML = `<div class="top"><button class="btn" data-back>&larr; Clients</button><h1>${esc(c.name || 'New client')}</h1><span class="save" id="saveSt">Saved</span></div>
  <div class="portal"><b style="flex:none">Client page</b>
    <label class="f">PIN (4-6 digits)<input data-f="pin" value="${esc(c.pin || '')}" inputmode="numeric" maxlength="6" placeholder="e.g. 4821"></label>
    <button class="btn sm" data-copy="${esc(portal)}">Copy link</button>
    <button class="btn sm" data-copymsg="1">Copy text to send</button>
    <label style="display:flex;gap:6px;align-items:center;font-size:13px;font-weight:600"><input type="checkbox" class="chk" data-active ${c.active !== false ? 'checked' : ''}> Active</label>
    <span class="empty" style="font-size:12.5px;flex-basis:100%">${c.pin ? esc(c.name.split(' ')[0]) + ' logs in at ' + esc(portal) + ' with PIN ' + esc(c.pin) + ' and sees calls, tasks and progress. Private notes stay hidden.' : 'Set a PIN to give them their own page.'}</span></div>
  <div class="kpis">
    <div class="kpi"><small>Flips this month</small><b>${mt.flips}${c.goals.flips ? ' <i>/ ' + esc(c.goals.flips) + ' goal</i>' : ''}</b><i>Started at ${esc(c.start.flips || '?')}/mo</i></div>
    <div class="kpi"><small>Revenue this month</small><b>${money(mt.revenue)}</b><i>Goal ${esc(c.goals.revenue ? money(c.goals.revenue) : '-')}</i></div>
    <div class="kpi"><small>Profit this month</small><b>${money(mt.profit)}</b><i>Goal ${esc(c.goals.profit || '-')}</i></div>
    <div class="kpi"><small>Program</small><b>${Math.round(progressPct(c) * 100)}%</b><i>${fmtD(c.program.start)} to ${fmtD(c.program.end)}</i></div>
    <div class="kpi"><small>Paid</small><b>${paidCount(c)}/${c.program.payments.length}</b><i>${money(c.program.payments.filter(p => p.paid).reduce((a, p) => a + num(p.amount), 0))} collected</i></div>
  </div>
  <div class="grid2">
    <div class="card"><h2>Calls<span class="sp"></span><button class="btn sm" data-addcall>+ Call</button></h2>
      ${c.calls.length ? c.calls.slice().sort((a, b) => String(b.date).localeCompare(String(a.date))).map(x => `<div class="row" style="flex-wrap:wrap"><input type="text" class="grow" data-list="calls" data-id="${x.id}" data-k="title" value="${esc(x.title)}" placeholder="Call #"><input type="date" data-list="calls" data-id="${x.id}" data-k="date" value="${esc(x.date)}">
        <input type="url" style="flex:1 1 100%" data-list="calls" data-id="${x.id}" data-k="link" value="${esc(x.link)}" placeholder="Fathom link">

// ---------- YouTube: posting calendar + idea bank ----------
const isPosted = v => !!(v.posted || v.status === 'Posted');
let YM = null;   // month shown on the calendar (YYYY-MM)
function renderYouTube(){
  const mk = monthKey(), today = todayISO();
  YM = YM || mk;
  const [y, m] = YM.split('-').map(Number), first = new Date(y, m - 1, 1), days = new Date(y, m, 0).getDate();
  const lead = (first.getDay() + 6) % 7, cells = Math.ceil((lead + days) / 7) * 7;
  const dated = D.videos.filter(v => v.date), ideas = D.videos.filter(v => !v.date).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  const next = dated.filter(v => !isPosted(v) && v.date >= today).sort((a, b) => a.date.localeCompare(b.date))[0];
  const ev = v => `<div class="ev ${isPosted(v) ? 'posted' : v.date < today ? 'late' : 'sched'}" data-video="${v.id}" draggable="true">${esc(v.title || 'Untitled')}<small>${isPosted(v) ? 'Posted' : v.date < today ? 'Not marked posted' : 'Scheduled'}</small></div>`;
  let grid = '';
  for (let k = 0; k < cells; k++) {
    const d = new Date(y, m - 1, 1 - lead + k), iso = d.toLocaleDateString('en-CA'), inM = d.getMonth() === m - 1;
    grid += `<div class="d${inM ? '' : ' o'}${iso === today ? ' t' : ''}" data-day="${iso}"><div class="n">${d.getDate()}</div>${dated.filter(v => v.date === iso).map(ev).join('')}</div>`;
  }
  const monthList = dated.filter(v => v.date.slice(0, 7) === YM).sort((a, b) => a.date.localeCompare(b.date));
  $('view').innerHTML = `<div class="top"><h1>YouTube</h1><button class="btn p" data-newvideo>+ Video</button></div>
  <div class="kpis"><div class="kpi"><small>Posted this month</small><b>${D.videos.filter(v => isPosted(v) && String(v.date || '').slice(0, 7) === mk).length}</b></div>
    <div class="kpi"><small>Scheduled</small><b>${dated.filter(v => !isPosted(v) && v.date >= today).length}</b></div>
    <div class="kpi"><small>Ideas in the bank</small><b>${ideas.length}</b></div>
    <div class="kpi"><small>Next upload</small><b style="font-size:18px">${next ? new Date(next.date + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }) : '-'}</b></div></div>
  <div class="ytwrap"><div>
    <div class="calbar"><button class="btn" data-ym="-1">&larr;</button><h2>${first.toLocaleDateString('en-US', { month: 'long', year: 'numeric' })}</h2><button class="btn" data-ym="1">&rarr;</button></div>
    <div class="cal">${['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(x => `<div class="dow">${x}</div>`).join('')}${grid}</div>
    <div class="agenda">${monthList.length ? monthList.map(v => `<div class="vc" data-video="${v.id}"><b>${new Date(v.date + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' })} &middot; ${esc(v.title || 'Untitled')}</b><small>${isPosted(v) ? 'Posted' : 'Scheduled'}</small></div>`).join('') : '<p class="empty">No uploads scheduled this month.</p>'}</div>
    <p class="empty" style="font-size:12.5px;margin-top:8px">Tap a day to plan a video for it. Drag videos between days, or drag an idea from the bank onto a day.</p>
  </div>
  <div class="card bank" data-day=""><h2>Idea bank</h2>${ideas.map(v => `<div class="vc" data-video="${v.id}" draggable="true"><b>${esc(v.title || 'Untitled')}</b><small>${esc((v.hook || '').slice(0, 80)) || 'No hook yet'}</small></div>`).join('') || '<p class="empty" style="font-size:13px">Ideas with no post date land here.</p>'}</div></div>`;
}

  const c = curClient(); if (!c) return; const t = e.target;
  if (t.dataset.f) { let v = t.value; if (t.type === 'number') v = t.value === '' ? '' : num(t.value); setPath(c, t.dataset.f, v); return queueSave(c); }
  if (t.dataset.list) { const it = c[t.dataset.list].find(x => x.id === t.dataset.id); if (it) { it[t.dataset.k] = t.value; queueSave(c); } return; }
  if (t.dataset.pay != null) { const p = c.program.payments[+t.dataset.pay]; p[t.dataset.k] = t.dataset.k === 'amount' ? num(t.value) : t.value; return queueSave(c); }
  if (t.dataset.tasktext) { const tk = c.tasks.find(x => x.id === t.dataset.tasktext); if (tk) { tk.text = t.textContent.trim(); queueSave(c); } }
});
document.addEventListener('change', e => {
  const c = curClient(); if (!c) return; const t = e.target;
  if (t.dataset.task) { const tk = c.tasks.find(x => x.id === t.dataset.task); if (tk.recurring) tk.doneWeek = t.checked ? D.week : ''; else tk.done = t.checked; queueSave(c); return renderClient(); }
  if (t.dataset.paid != null) { const p = c.program.payments[+t.dataset.paid]; p.paid = t.checked; if (t.checked && !p.paidAt) p.paidAt = todayISO(); queueSave(c); return renderClient(); }
  if (t.hasAttribute('data-active')) { c.active = t.checked; queueSave(c); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('m-item').classList.remove('on'); if (e.key === 'Enter' && e.target.dataset && e.target.dataset.tasktext) { e.preventDefault(); e.target.blur(); } });

const q = new URLSearchParams(location.search); TAB = ['home', 'clients', 'youtube', 'pipeline'].includes(q.get('tab')) ? q.get('tab') : 'home'; CUR = q.get('id');
document.querySelectorAll('.nav').forEach(n => n.classList.toggle('on', n.dataset.tab === TAB));
load();
</script>

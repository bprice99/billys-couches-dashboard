<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brand New Sectionals | Billy's Couches</title>
<meta name="description" content="Brand-new sectionals in Pacific, MO without the big-store markup. Reserve yours with a $100 deposit.">
<link rel="icon" href="/favicon.png">
<style>
:root{--ink:#2b1d16;--muted:#7a6c64;--line:#eee4dc;--bg:#faf7f3;--red:#b0524c;--green:#2e7d4f;--cream:#efe9e2}
*{box-sizing:border-box}html,body{margin:0}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
a{color:inherit}.serif{font-family:Georgia,"Times New Roman",serif;font-weight:400}
.nav{display:flex;align-items:center;justify-content:space-between;padding:12px 32px;background:#fff;border-bottom:1px solid var(--line)}
.nav .l{display:flex;align-items:center;gap:22px}.nav img{height:40px;display:block}.nav .l a{font-size:14px;color:var(--muted);text-decoration:none}.nav .l a.on{color:var(--ink);font-weight:700}
.btn{display:inline-block;border:0;cursor:pointer;background:var(--red);color:#fff;border-radius:999px;padding:14px 24px;font:inherit;font-weight:700;font-size:15px;text-decoration:none;text-align:center}
.btn.o{background:#fff;color:var(--ink);border:1.5px solid #d9cdc4}.btn.sm{padding:9px 16px;font-size:14px}.btn:disabled{opacity:.5;cursor:default}
.tag{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.12em;color:var(--red);text-transform:uppercase}
.wrap{max-width:1180px;margin:0 auto}
.hero{padding:48px 24px 28px;text-align:center}.hero h1{font-size:46px;margin:10px 0 12px;line-height:1.08}.hero p{color:#6b5d55;font-size:17px;max-width:640px;margin:0 auto 22px;line-height:1.55}
.cd{display:flex;gap:12px;justify-content:center;margin:6px 0 22px}.cd div{background:var(--ink);color:#fff;border-radius:16px;width:92px;padding:14px 0}.cd b{display:block;font-size:34px;font-weight:800;font-variant-numeric:tabular-nums}.cd small{font-size:11px;letter-spacing:.1em;color:#cbbcb0;font-weight:700}
.chips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.chips span{background:#fff;border:1px solid #e6dcd5;border-radius:999px;padding:9px 16px;font-size:14px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:24px;padding:28px 24px 36px}
.card{background:#fff;border-radius:18px;overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column}
.ph{position:relative;aspect-ratio:16/10;background:#fff center 78%/cover no-repeat;cursor:pointer;border-bottom:1px solid var(--line)}.ph.cover{background-size:cover}
.badge{position:absolute;top:12px;left:12px;color:#fff;font-size:11px;font-weight:800;letter-spacing:.06em;padding:6px 10px;border-radius:999px;background:var(--red)}.badge.g{background:var(--green)}
.bd{padding:18px 20px 20px;display:flex;flex-direction:column;flex:1}.bd h3{margin:0 0 4px;font-size:20px}.br{font-size:13.5px;color:var(--muted)}
.pr{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:12px 0 2px}.pr b{font-size:26px;font-weight:800}.pr s{color:#9a8f86;font-size:14px}.save{background:#e3efe6;color:var(--green);font-weight:800;font-size:12.5px;padding:4px 9px;border-radius:999px}
.lp{font-size:13px;color:var(--muted)}.tl{display:inline-block;margin-top:8px;background:#f3ece6;border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:700;color:var(--ink)}
.specs{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:14px 0 4px;font-size:13.5px}.specs span{color:var(--muted)}.specs b{font-weight:600}
.left{display:flex;justify-content:space-between;font-size:13px;font-weight:800;color:var(--red);margin:14px 0 6px}.bar{height:8px;background:#f3ece6;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--red)}
.row{display:flex;gap:10px;margin-top:auto;padding-top:16px}.row .btn{flex:1;padding:13px 10px}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:0 24px 40px}.how div{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}.how em{font-style:normal;display:inline-block;background:var(--ink);color:#fff;border-radius:50%;width:26px;height:26px;text-align:center;line-height:26px;font-weight:800;margin-bottom:8px}.how b{display:block;margin-bottom:4px}.how p{margin:0;font-size:14px;color:#6b5d55;line-height:1.5}
.band{margin:0 24px 40px;background:var(--ink);color:#fff;border-radius:20px;padding:26px 30px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}.band h3{margin:0 0 4px;font-size:22px}.band p{margin:0;color:#d8cfc6}.band .btn{background:#fff;color:var(--ink)}
.det{display:grid;grid-template-columns:1.2fr 1fr;gap:36px;padding:28px 24px}
.main{border-radius:20px;overflow:hidden;background-color:#fff;border:1px solid var(--line);position:relative;aspect-ratio:4/3;background-position:center 82%;background-size:contain;background-repeat:no-repeat}
.thumbs{display:grid;grid-auto-flow:column;grid-auto-columns:calc(25% - 8px);gap:10px;margin-top:10px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}.thumbs button{scroll-snap-align:start}.thumbs button{aspect-ratio:4/3;border-radius:12px;background:#fff center/cover no-repeat;border:2px solid var(--line);cursor:pointer;padding:0}.thumbs button.on{border-color:var(--ink)}
.note{font-size:12.5px;color:var(--muted);margin-top:8px}
.det h1{font-size:40px;margin:8px 0 6px;line-height:1.1}.det .pr b{font-size:34px}
.cdbox{background:var(--ink);color:#fff;border-radius:16px;padding:14px 16px;margin:16px 0;display:flex;justify-content:space-between;align-items:center;gap:10px}.cdbox small{color:#cbbcb0;font-size:12px;font-weight:700;letter-spacing:.06em}.cdbox .t{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.dep{background:#fff;border:1px solid var(--line);border-radius:16px;padding:4px 18px;margin-top:14px}.dep div{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f1e9e3;font-size:15px}.dep div:last-child{border:0;font-weight:800}.dep span{color:var(--muted)}
.ctas{display:flex;gap:10px;margin-top:14px}.ctas .btn{flex:1}
.fine{font-size:12.5px;color:var(--muted);margin-top:10px;line-height:1.5}
.stack{background:#fff;border:1px solid var(--line);border-radius:16px;padding:4px 18px;margin:16px 0}.stack div{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f1e9e3;font-size:15px}.stack div:last-child{border:0}.stack span{color:var(--muted)}.stack b{color:var(--green)}
.low{display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:0 24px 40px}
.box{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px 24px}.box h3{margin:0 0 12px;font-size:20px}.box p{color:#6b5d55;line-height:1.55;margin:0}
.box table{width:100%;border-collapse:collapse;font-size:14.5px}.box td{padding:10px 4px;border-bottom:1px solid #f1e9e3;vertical-align:top}.box td:first-child{color:var(--muted);width:38%}.box td:last-child{font-weight:600}.box tr:last-child td{border:0}
.terms{background:#fdf3e1;border-radius:16px;padding:18px 20px;font-size:14px;line-height:1.55}.terms h3{margin:0 0 8px;font-size:18px}.terms ul{margin:0;padding-left:18px}
.back{display:inline-block;margin:20px 24px 0;font-size:14px;color:var(--muted);text-decoration:none;cursor:pointer;background:none;border:0;font:inherit}
.why{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding:0 24px 30px}.why div{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}.why b{display:block;font-size:16px;margin-bottom:4px}.why p{margin:0;font-size:14px;color:#6b5d55;line-height:1.5}
.mask{position:fixed;inset:0;background:rgba(30,20,15,.5);display:none;align-items:flex-start;justify-content:center;z-index:50;overflow:auto;padding:30px 14px}.mask.on{display:flex}
.modal{background:var(--bg);border-radius:20px;max-width:480px;width:100%;padding:22px;position:relative}.modal h2{margin:0 0 4px;font-size:22px}.modal .s{color:var(--muted);font-size:14px;margin-bottom:14px}
.x{position:absolute;top:12px;right:14px;background:none;border:0;font-size:26px;cursor:pointer;color:var(--muted)}
.modal input[type=text],.modal input[type=tel],.modal input[type=email]{width:100%;border:1px solid #d9cdc4;border-radius:12px;padding:12px;font:inherit;font-size:16px;margin-top:10px;background:#fff}
.chk{display:flex;gap:10px;font-size:14px;margin-top:14px;align-items:flex-start;line-height:1.45;cursor:pointer}.chk input{width:20px;height:20px;flex:none;margin-top:1px;accent-color:var(--ink)}
.err{color:var(--red);font-weight:700;font-size:14px;margin-top:10px;min-height:1px}
.modal .btn{width:100%;margin-top:14px}
.ok{max-width:620px;margin:40px auto;background:#fff;border:1px solid var(--line);border-radius:20px;padding:30px;text-align:center}.ok h1{font-size:34px;margin:8px 0}.ok p{color:#6b5d55;line-height:1.55}
.empty{padding:60px 20px;text-align:center;color:var(--muted)}
body.embed .nav{display:none}
#app.fade{animation:bnIn .22s ease-out}@keyframes bnIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@media (prefers-reduced-motion:reduce){#app.fade{animation:none}}
@media (max-width:820px){.hero h1 br{display:none}.nav{padding:10px 16px}.nav .l a:not(:first-child){display:none}.hero{padding:34px 16px 20px}.hero h1{font-size:32px}.cd div{width:72px}.cd b{font-size:26px}
 .grid,.det,.low{grid-template-columns:1fr;padding-left:16px;padding-right:16px}.how,.why{grid-template-columns:1fr;padding:0 16px 30px}.band{margin:0 16px 30px}.det h1{font-size:30px}.back{margin:16px 16px 0}.cdbox .t{font-size:18px}.ctas{flex-direction:column}}
@media (max-width:420px){.row{flex-direction:column}}
</style></head>
<body>
<div class="nav"><div class="l"><a href="https://www.billyscouches.com/" target="_top"><img src="/public/logo.png" alt="Billy's Couches"></a><a href="https://www.billyscouches.com/currentinventory" target="_top">Shop all</a><a class="on" href="/brand-new">New</a><a href="https://www.billyscouches.com/currentinventory" target="_top">Like New</a><a href="https://www.billyscouches.com/warehouseshowing" target="_top">Visit</a></div><a class="btn sm" href="sms:+13148997503">Text Billy</a></div>
<div id="app"><div class="empty">Loading...</div></div>
<div class="mask" id="mask"><div class="modal" id="modal"></div></div>
<script>
const Q = new URLSearchParams(location.search);
if (Q.get('embed') === '1' || window.top !== window.self) document.body.classList.add('embed');
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const money = n => '$' + Math.round(n).toLocaleString('en-US');
let D = null, VIEW = Q.get('p') || '', PIC = 0, SKEW = 0, TICK = null;
const SHOWING = 'https://www.billyscouches.com/warehouseshowing', BUY = 'https://order.billyscouches.com/';
function postHeight(){ try { parent.postMessage({ bnH: document.documentElement.scrollHeight }, '*'); } catch {} }
// Inside the website page (iframe): the site tells us where its window is, so the reserve box opens where they are looking.
const EMB = window.top !== window.self; let PV = null;
addEventListener('message', e => { if (e.data && e.data.bnView) PV = e.data.bnView; });
if (EMB) try { parent.postMessage({ bnAsk: 1 }, '*'); } catch {}
function toTop(){ try { window.scrollTo({ top: 0, behavior: 'instant' }); } catch { window.scrollTo(0, 0); } if (EMB) try { parent.postMessage({ bnTop: 1 }, '*'); } catch {} }
// Swap views: jump to the top first (no scroll animation), then fade the new view in.
function swapView(){ toTop(); requestAnimationFrame(() => { const a = $('app'); a.classList.remove('fade'); render(); void a.offsetWidth; a.classList.add('fade'); }); }
new ResizeObserver(postHeight).observe(document.body);
async function load(){
  try { D = await (await fetch('/public/brand-new', { cache: 'no-store' })).json(); SKEW = D.now - Date.now(); }
  catch { $('app').innerHTML = '<div class="empty">Could not load. Refresh the page, or text Billy at (314) 899-7503.</div>'; return; }
  await cropPhotos();
  if (Q.get('bnr')) return confirmDeposit();
  render();
}
// Trim photos that need it (e.g. a title baked into the top of the image) so every card looks clean.
const CROPPED = {};
async function cropPhotos(){
  await Promise.all(D.products.map(p => Promise.all(Object.entries(p.crop || {}).map(([u, c]) => CROPPED[u] ? 0 : new Promise(ok => {
    const im = new Image(); im.onload = () => { try { const cv = document.createElement('canvas'); cv.width = c[2]; cv.height = c[3]; const x = cv.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c[2], c[3]); x.drawImage(im, c[0], c[1], c[2], c[3], 0, 0, c[2], c[3]); CROPPED[u] = cv.toDataURL('image/jpeg', .9); } catch {} ok(); };
    im.onerror = () => ok(); im.src = u; })))));
  D.products.forEach(p => { p.photos = p.photos.map(u => CROPPED[u] || u); });
}
function left(){ return Math.max(0, D.launchAt - (Date.now() + SKEW)); }
function parts(ms){ const s = Math.floor(ms / 1000); return [Math.floor(s / 86400), Math.floor(s % 86400 / 3600), Math.floor(s % 3600 / 60), s % 60]; }
const pad = n => String(n).padStart(2, '0');
function tick(){
  if (D.live) return;
  const ms = left(); if (ms <= 0) { clearInterval(TICK); load(); return; }
  const [d, h, m, s] = parts(ms);
  document.querySelectorAll('[data-cd]').forEach(el => { el.innerHTML = el.dataset.cd === 'big' ? `<div><b>${d}</b><small>DAYS</small></div><div><b>${pad(h)}</b><small>HOURS</small></div><div><b>${pad(m)}</b><small>MINUTES</small></div><div><b>${pad(s)}</b><small>SECONDS</small></div>` : `${d}d : ${pad(h)}h : ${pad(m)}m : ${pad(s)}s`; });
}
const P = id => D.products.find(p => p.id === id);
const shortName = p => p.name.replace(' 5-Piece Sectional', '');
function priceRow(p){
  return D.live ? `<div class="pr"><b>${money(p.price)}</b></div>`
    : `<div class="pr"><b>${money(p.launch)}</b><s>${money(p.price)}</s><span class="save">Launch price · save ${money(p.price - p.launch)}</span></div><div class="lp">Reserve before Dec 1. Goes to ${money(p.price)} when it lands.</div>`;
}
function stockBar(p){
  if (D.live) return `<div class="left"><span>${p.left ? 'In stock in Pacific' : 'Sold out'}</span><span>${p.left} left</span></div>`;
  return `<div class="left"><span>${!p.left ? 'All reserved' : p.left < p.units ? 'Only ' + p.left + ' left' : p.left + ' left'}</span><span>Arriving Dec 1</span></div>`;
}
function ctas(p, big){
  if (D.live) return p.left ? `<a class="btn" href="${BUY}" target="_top">Buy now</a><a class="btn o" href="${SHOWING}" target="_top">Come sit on it</a>` : `<a class="btn o" href="sms:+13148997503">Text Billy for the waitlist</a>`;
  return p.left ? `<button class="btn" data-res="${p.id}">Reserve ${big ? 'mine ' : ''}with $${D.deposit}</button>${big ? '<a class="btn o" href="sms:+13148997503">Text Billy a question</a>' : `<button class="btn o" data-view="${p.id}">Full details</button>`}`
    : `<a class="btn o" href="sms:+13148997503">All reserved. Text Billy for the waitlist</a>`;
}
function render(){
  clearInterval(TICK);
  const p = VIEW && P(VIEW);
  $('app').innerHTML = p ? detail(p) : grid();
  if (!D.live) { tick(); TICK = setInterval(tick, 1000); }
  postHeight();
}
function grid(){
  const L = D.live;
  const hero = L ? `<div class="hero"><span class="tag">Brand new · never sat on</span><h1 class="serif">New sectionals, without the <br>big-store markup.</h1><p>Hand-picked new sectionals, in stock in Pacific. Sit on them today, and have yours in your living room this week.</p>
      <div class="chips"><span>✓ In stock, not special order</span><span>✓ $${D.deliveryFee} white-glove delivery</span><span>✓ Sit on it first</span></div></div>`
    : `<div class="hero"><span class="tag">Brand new · first truckload · arriving Dec 1</span><h1 class="serif">Reserve a brand-new sectional <br>before it lands.</h1><p>Only 4 of each are coming on this truck. Hold yours with a $${D.deposit} deposit, and it's set aside with your name on it.</p>
      <div class="cd" data-cd="big"></div>
      <div class="chips"><span>✓ Brand new, never sat on</span><span>✓ $${D.deliveryFee} white-glove delivery</span><span>✓ Deposit comes off your price</span><span>✓ Refundable until it arrives</span></div></div>`;
  const cards = D.products.map(p => `<div class="card"><div class="ph" data-view="${p.id}" style="background-image:url(${p.photos[0]})${/^https?:/.test(p.photos[0]) ? '' : ';background-size:contain;background-position:center'}"><span class="badge${L ? ' g' : ''}">${L ? (p.left ? 'IN STOCK' : 'SOLD OUT') : 'ARRIVING DEC 1'}</span></div>
    <div class="bd"><h3>${esc(p.name)}</h3><div class="br">${esc(p.brand)} · ${esc(p.color)}</div>${p.tagline ? `<div class="tl">${esc(p.tagline)}</div>` : ''}${priceRow(p)}
    <div class="specs">${p.specs.filter(s => ['Overall size', 'Fabric', 'Pieces'].includes(s[0])).map(s => `<span>${esc(s[0])}</span><b>${esc(s[1])}</b>`).join('')}</div>
    ${stockBar(p)}<div class="row">${ctas(p)}</div></div></div>`).join('');
  const how = L ? '' : `<div class="how"><div><em>1</em><b>Reserve with $${D.deposit}</b><p>Your sectional comes off the list the second you pay. The $${D.deposit} comes off your total.</p></div><div><em>2</em><b>We text you when it lands</b><p>Estimated Dec 1. If the truck runs late, you'll hear from Billy first.</p></div><div><em>3</em><b>Pay the rest and get it home</b><p>Pick it up, or get $${D.deliveryFee} white-glove delivery. Change your mind before it lands? Full refund.</p></div></div>`;
  return `<div class="wrap">${hero}<div class="grid">${cards}</div>${how}<div class="band"><div><h3 class="serif">Looking for a bigger deal?</h3><p>Our Like New floor has name-brand sectionals up to 50% off retail.</p></div><a class="btn" href="https://www.billyscouches.com/currentinventory" target="_top">Shop Like New →</a></div></div>`;
}
function detail(p){
  const L = D.live, pic = p.photos[Math.min(PIC, p.photos.length - 1)];
  const specs = `<div class="box"><h3>Specs</h3><table>${p.specs.map(s => `<tr><td>${esc(s[0])}</td><td>${esc(s[1])}</td></tr>`).join('')}</table></div>`;
  const right = L
    ? `<div class="stack"><div><span>Brand new, never sat on</span><b>✓</b></div><div><span>Delivered and set up</span><b>$${D.deliveryFee}</b></div><div><span>Sit on it before you buy</span><b>✓</b></div></div>`
    : `<div class="cdbox"><div><small>LANDS IN PACIFIC IN</small><div class="t" data-cd="small"></div></div><div style="text-align:right"><small>EST. ARRIVAL</small><div style="font-weight:800">Dec 1</div></div></div>
       <div class="dep"><div><span>Launch price</span><b>${money(p.launch)}</b></div><div><span>Reserve today</span><b>$${D.deposit}</b></div><div><span>Due when it lands</span><b>${money(p.launch - D.deposit)}</b></div></div><div class="fine">Plus sales tax. Pickup is free, or $${D.deliveryFee} for white-glove delivery.</div>`;
  return `<div class="wrap"><button class="back" data-view="">← All brand-new sectionals</button>
  <div class="det"><div><div class="main" style="background-image:url(${pic});background-size:${/^https?:/.test(pic) ? 'cover' : 'contain'}"><span class="badge${L ? ' g' : ''}">${L ? (p.left ? 'IN STOCK' : 'SOLD OUT') : 'ARRIVING DEC 1'}</span></div>
    ${p.photos.length > 1 ? `<div class="thumbs">${p.photos.map((f, i) => `<button class="${i === PIC ? 'on' : ''}" data-pic="${i}" style="background-image:url(${f})" aria-label="Photo ${i + 1}"></button>`).join('')}</div>` : ''}
    ${p.note ? `<div class="note">${esc(p.note)}</div>` : ''}</div>
  <div><span class="tag">${L ? 'Brand new · in stock in Pacific' : 'Brand new · first truckload'}</span><h1 class="serif">${esc(p.name)}</h1><div class="br" style="font-size:15px">${esc(p.brand)} · ${esc(p.color)} · ${esc(p.specs[0][1])}</div>
    ${priceRow(p)}${right}${stockBar(p)}<div class="ctas">${ctas(p, true)}</div>
    ${L ? '' : `<div class="fine">Your deposit holds this exact sectional and comes off your price. Fully refundable until it arrives.</div>`}</div></div>
  <div class="low"><div><div class="box" style="margin-bottom:20px"><h3>About the ${esc(shortName(p))}</h3><p>${esc(p.blurb)}</p></div>${specs}</div>
    <div><div class="box" style="margin-bottom:20px"><h3>Will it fit your room?</h3><p style="margin-bottom:14px">Drop the ${esc(shortName(p))} into your room with our free sizing tool. Takes 2 minutes.</p><a class="btn o sm" href="${D.fitUrl}?couch=bn-${p.id}" target="_top">Try it in my room →</a></div>
    ${L ? '' : terms()}</div></div>
  <div class="why"><div><b>Sectional specialists</b><p>We only sell couches, so we know what lasts.</p></div><div><b>No big-store markup</b><p>No giant showroom, no commissioned salespeople.</p></div><div><b>Sit on it first</b><p>Come try it in Pacific before it goes home.</p></div><div><b>Text the owner</b><p>Questions go to Billy, not a call center.</p></div></div></div>`;
}
function terms(){
  return `<div class="terms"><h3>What your $${D.deposit} deposit means</h3><ul>
  <li>This exact sectional is set aside for you. Nobody else can buy it.</li>
  <li>The $${D.deposit} comes off your price. You pay the rest, plus sales tax, when it lands.</li>
  <li>Estimated arrival is Dec 1. Billy texts you the day it lands.</li>
  <li>Change your mind before it arrives? Full refund, no questions.</li>
  <li>Once it lands, you have 7 days to pick up or book delivery.</li></ul></div>`;
}
function openReserve(id){
  const p = P(id); if (!p) return;
  $('modal').innerHTML = `<button class="x" data-close aria-label="Close">×</button><h2>Reserve your ${esc(shortName(p))}</h2><div class="s">You're holding 1 of the ${p.units} ${esc(shortName(p))} sectionals (${esc(p.color)}).</div>
    <div class="dep" style="margin-top:0"><div><span>${esc(p.name)}</span><b>${money(p.now)}</b></div><div><span>Deposit today</span><b>$${D.deposit}</b></div><div><span>Due when it arrives</span><b>${money(p.now - D.deposit)}</b></div></div><div class="fine">Plus sales tax when it arrives. Pickup is free, or $${D.deliveryFee} for white-glove delivery.</div>
    <div style="margin-top:14px">${terms()}</div>
    <form id="rf"><input type="text" name="name" placeholder="Full name" autocomplete="name" required><input type="tel" name="phone" placeholder="Phone" autocomplete="tel" required><input type="email" name="email" placeholder="Email" autocomplete="email" required>
    <label class="chk"><input type="checkbox" name="agree"><span>I understand I'm paying a $${D.deposit} deposit to hold this sectional, and the rest (${money(p.now - D.deposit)} plus sales tax, and delivery if I want it) is due when it arrives.</span></label>
    <div class="err" id="rerr"></div><button class="btn" type="submit" id="rgo">Pay $${D.deposit} deposit</button><div class="fine" style="text-align:center">Secure checkout by Stripe</div></form>`;
  const mk = $('mask');
  if (EMB && PV) { mk.style.position = 'absolute'; mk.style.inset = 'auto 0 auto 0'; mk.style.top = Math.max(0, PV.y) + 'px'; mk.style.height = PV.h + 'px'; }
  mk.classList.add('on');
  $('rf').onsubmit = async e => {
    e.preventDefault(); const f = e.target, b = $('rgo'); $('rerr').textContent = '';
    if (!f.agree.checked) { $('rerr').textContent = 'Tick the box to show you understand how the deposit works.'; return; }
    b.disabled = true; b.textContent = 'Opening secure checkout...';
    try {
      const r = await fetch('/public/brand-new/reserve', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ item: id, name: f.name.value, phone: f.phone.value, email: f.email.value, agree: true }) });
      const j = await r.json(); if (!j.url) throw new Error(j.error || 'Something went wrong.');
      try { window.top.location.href = j.url; } catch { location.href = j.url; }
    } catch (err) { $('rerr').textContent = err.message; b.disabled = false; b.textContent = `Pay $${D.deposit} deposit`; }
  };
}
async function confirmDeposit(){
  $('app').innerHTML = '<div class="ok"><h1 class="serif">Confirming your deposit...</h1><p>One second.</p></div>';
  let j = {};
  for (let i = 0; i < 4; i++) {
    try { j = await (await fetch('/public/brand-new/confirm', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ bnr: Q.get('bnr'), sid: Q.get('sid') }) })).json(); } catch { j = {}; }
    if (j.ok) break; await new Promise(r => setTimeout(r, 2500));
  }
  if (!j.ok) { $('app').innerHTML = `<div class="ok"><h1 class="serif">Almost there</h1><p>${esc(j.error || "We couldn't confirm your deposit yet.")}</p><p><a class="btn" href="sms:+13148997503">Text Billy</a></p></div>`; return; }
  const p = P(j.item) || { name: 'sectional', color: '' };
  $('app').innerHTML = `<div class="ok"><span class="tag">Reserved</span><h1 class="serif">Your ${esc(shortName(p))} is yours, ${esc(String(j.name).split(' ')[0])}.</h1>
    <p>We got your $${D.deposit} deposit and pulled this ${esc(shortName(p))} (${esc(p.color)}) off the list. You'll get a text from Billy in a minute.</p>
    <div class="dep" style="text-align:left;margin:18px 0 6px"><div><span>Price</span><b>${money(j.price)}</b></div><div><span>Deposit paid</span><b>$${D.deposit}</b></div><div><span>Due when it lands</span><b>${money(j.price - D.deposit)}</b></div></div><div class="fine" style="margin-bottom:14px">Plus sales tax when it arrives. Pickup is free, or $${D.deliveryFee} for white-glove delivery.</div>
    <p>Estimated arrival is <b>Dec 1</b>. Billy texts you the day it lands so you can pick it up or book delivery. Change your mind before then? Text Billy for a full refund.</p>
    <p><a class="btn o" href="https://www.billyscouches.com/" target="_top">Back to Billy's Couches</a></p></div>`;
  history.replaceState(null, '', '/brand-new'); postHeight();
}
document.addEventListener('click', e => {
  const v = e.target.closest('[data-view]'); if (v) { VIEW = v.dataset.view; PIC = 0; history.replaceState(null, '', '/brand-new' + (VIEW ? '?p=' + VIEW : '')); swapView(); return; }
  const r = e.target.closest('[data-res]'); if (r) { openReserve(r.dataset.res); return; }
  const pc = e.target.closest('[data-pic]'); if (pc) { PIC = +pc.dataset.pic; render(); return; }
  if (e.target.closest('[data-close]') || e.target.id === 'mask') $('mask').classList.remove('on');
});
load();
</script>
